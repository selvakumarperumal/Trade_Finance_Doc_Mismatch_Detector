name: trade_finance_doc_mismatch_detector

services:
  backend:
    build: ./backend
    image: trade_finance_doc_mismatch_detector:dev
    container_name: backend
    environment:
      - DB_URL=postgresql+asyncpg://detector:detector@postgres:5432/tfd_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=* --reload
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=detector
      - POSTGRES_PASSWORD=detector
      - POSTGRES_DB=tfd_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U detector -d tfd_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  redisdata:
      
