[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "botocore>=1.40.61",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.37.0",
    "pydantic-graph>=2.37.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-multipart>=0.0.32",
    "python-socketio>=5.11",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Async tests are opted into with @pytest.mark.asyncio rather than picked up by name.
asyncio_mode = "strict"

# Both scopes are set explicitly because pytest-asyncio deprecates leaving them unset:
# it is changing the fixture default from "fixture" to "function", and warns until you
# say which you want. "function" is that coming default and what this suite already
# assumes — every test gets a fresh event loop, so no state leaks between them.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
